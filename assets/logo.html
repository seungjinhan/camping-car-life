<!doctype html>
<html><body style="margin:0;background:#fff">
<!-- 캠핑카라이프 아이콘 (600×600). 운영자 캐릭터(character.jpg)를 오려 내고, 산길과 작은 캠핑카를 수채화로 그렸어요. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="paint" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0.5 0 0 0 -0.18"/>
    </filter>
    <filter id="feather"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>

    <!-- 머리부터 어깨까지 오려내는 윤곽 (원본 이미지 좌표, asia_travel 아이콘과 같은 원본) -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="-100" width="1648" height="1300">
      <path filter="url(#feather)" fill="#fff" d="M505,135 L545,138 600,160 665,185 705,160 760,140 800,122 835,120 850,145 895,150 905,160 960,110 1020,60 1042,60 1058,120 1070,215 1074,245 1090,262 1100,285 1112,305 1130,335 1132,372 1150,420 1152,450 1140,490 1112,522 1100,545 1082,560 1065,590 1052,606 1100,648 1150,680 1210,740 1250,830 1268,900 1268,980 L340,980 340,815 410,790 470,722 560,686 612,676 640,642 610,625 598,595 572,575 548,565 545,540 546,460 548,400 540,365 522,348 548,312 520,240 Z"/>
    </mask>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcde6"/><stop offset=".7" stop-color="#d9eef0"/><stop offset="1" stop-color="#fbe6c4"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb9c9"/><stop offset="1" stop-color="#b9d3d6"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa77d"/><stop offset="1" stop-color="#3f8a63"/></linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#efe3cc"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fa6a0"/><stop offset="1" stop-color="#22867f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9ecf3"/><stop offset="1" stop-color="#7fbfd0"/></linearGradient>
  </defs>

  <!-- 배경: 하늘, 해, 먼 산, 가까운 산, 길 -->
  <rect width="600" height="600" fill="#fbf4e6"/>
  <path filter="url(#wash)" fill="url(#sky)" d="M-40,-40 H640 V380 H-40 Z"/>
  <circle filter="url(#paint)" cx="88" cy="96" r="42" fill="#f8c94f"/>
  <circle filter="url(#soft)" cx="88" cy="96" r="62" fill="#f8c94f" opacity=".35"/>
  <path filter="url(#wash)" fill="#fff" opacity=".6" d="M430,80 q34,-26 78,-12 q50,-20 86,10 q-26,22 -78,15 q-52,14 -86,-13 Z"/>
  <path filter="url(#wash)" fill="url(#far)" d="M-40,330 L60,230 130,290 210,200 300,300 380,220 470,290 560,210 640,280 V420 H-40 Z"/>
  <path filter="url(#wash)" fill="url(#near)" d="M-40,400 C60,330 140,350 220,380 C320,340 420,320 640,380 V640 H-40 Z"/>
  <path filter="url(#wash)" fill="#d8c3a0" d="M180,640 C230,560 280,500 330,460 C340,455 360,455 368,460 C330,510 300,570 290,640 Z"/>
  <path filter="url(#paint)" stroke="#fffaf0" stroke-width="5" stroke-dasharray="16 16" fill="none" d="M242,630 C270,570 305,510 345,468"/>

  <!-- 캐릭터 (오려 낸 머리와 어깨) -->
  <g transform="translate(300 20) scale(.6) translate(-830 0)">
    <image href="character.jpg" x="0" y="0" width="1648" height="1200" mask="url(#cut)"/>
  </g>

  <!-- 작은 캠핑카 -->
  <g filter="url(#paint)" transform="translate(150 438)">
    <ellipse cx="150" cy="150" rx="168" ry="14" fill="#2b3a2e" opacity=".28"/>
    <!-- 팝업 지붕 -->
    <path d="M58,26 L240,26 C252,26 258,32 258,42 L258,46 L48,46 L48,38 C48,31 52,26 58,26 Z" fill="#e4674f"/>
    <!-- 차체 -->
    <path d="M30,46 H262 C282,46 296,60 298,80 L302,118 C302,130 294,138 282,138 H24 C12,138 4,130 4,118 V74 C4,58 16,46 30,46 Z" fill="url(#van)" stroke="#c9b48f" stroke-width="2"/>
    <!-- 앞유리 · 창문 -->
    <path d="M232,56 H262 C276,56 286,66 288,80 L290,92 H232 Z" fill="url(#glass)"/>
    <rect x="128" y="58" width="88" height="34" rx="8" fill="url(#glass)"/>
    <rect x="22" y="58" width="92" height="34" rx="8" fill="url(#glass)"/>
    <path d="M30,64 L58,88 M140,64 L166,88" stroke="#fff" stroke-width="5" opacity=".6"/>
    <!-- 띠 -->
    <rect x="4" y="100" width="298" height="14" fill="url(#band)"/>
    <!-- 문 · 손잡이 · 전조등 -->
    <path d="M222,58 V136" stroke="#c9b48f" stroke-width="2"/>
    <rect x="200" y="120" width="14" height="4" rx="2" fill="#9a8a6a"/>
    <circle cx="292" cy="122" r="6" fill="#f8c94f"/>
    <rect x="0" y="122" width="10" height="8" rx="2" fill="#e4674f"/>
    <!-- 바퀴 -->
    <circle cx="70" cy="140" r="24" fill="#2a2d34"/>
    <circle cx="70" cy="140" r="10" fill="#c9cdd3"/>
    <circle cx="238" cy="140" r="24" fill="#2a2d34"/>
    <circle cx="238" cy="140" r="10" fill="#c9cdd3"/>
  </g>

  <!-- 전체 종이 질감 -->
  <rect width="600" height="600" filter="url(#paper)" opacity=".3"/>
</svg>
</body></html>
